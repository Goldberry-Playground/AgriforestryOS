name: Scripts CI

# Runs pytest against scripts/ (stdlib-only operator tools, e.g.
# new_client_project.py). No uv project here: plain python + pytest.
# Advisory only — promote to a required check after the first clean run.

on:
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8.2,<9"

      - name: Run pytest
        run: python -m pytest scripts/tests -v

      # GOL-3721: the auto-approve protected-paths carve-out (scripts/ci/).
      # Node ships on ubuntu-latest; the test is stdlib-only.
      - name: Run carve-out tests (node)
        run: |
          set -euo pipefail
          for t in scripts/ci/*.test.mjs; do node "$t"; done
