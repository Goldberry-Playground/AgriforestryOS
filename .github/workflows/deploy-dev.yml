name: Deploy to dev

# Auto-deploys the app to the Terraform-provisioned dev droplet on every merge
# to 4.x. Deploys CODE only — `drush updb` (DB migrations) is a deliberate
# MANUAL step (see migrate-dev.yml), per the "migrations are manual" decision.
#
# Dormant until configured: the job is skipped unless the repo variable
# DEPLOY_ENABLED == 'true', so merging this workflow doesn't cause failing runs
# before the droplet exists. (Secrets can't be read in job-level `if:`; a repo
# *variable* can — hence the vars gate.) To activate:
#   gh variable set DEPLOY_ENABLED --body true
# Required secrets once the box is up:
#   DEPLOY_HOST     — reserved IP from `terraform output -raw reserved_ip`
#   DEPLOY_SSH_KEY  — private key matching infra ssh_public_key
#   DEV_ENV_FILE    — full .env contents (1Password → GitHub secret)

on:
  push:
    branches: [4.x]
    paths:
      - 'modules/**'
      - 'sync-service/**'
      - 'postgis-etl/**'
      - 'docker/docker-compose.prod.yml'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app to dev droplet
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 15
    steps:
      - name: Write SSH key + env file
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ENV_FILE" > /tmp/agri.env

      - name: Ship env + deploy stack
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            /tmp/agri.env "deploy@${HOST}:/opt/agriforestryos/.env"
          $SSH "deploy@${HOST}" 'chmod 600 /opt/agriforestryos/.env'
          $SSH "deploy@${HOST}" bash -s <<'REMOTE'
            set -euo pipefail
            cd /opt/agriforestryos/repo
            git fetch --all --quiet
            git checkout 4.x
            git reset --hard origin/4.x
            cd docker
            docker compose --env-file /opt/agriforestryos/.env \
              -f docker-compose.prod.yml up -d --build
            # Cache rebuild is safe and idempotent. DB migrations (drush updb)
            # are intentionally NOT run here — trigger migrate-dev.yml manually.
            docker compose --env-file /opt/agriforestryos/.env \
              -f docker-compose.prod.yml exec -T www drush cr || true
          REMOTE
