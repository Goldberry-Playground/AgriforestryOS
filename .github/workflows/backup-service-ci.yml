name: Backup service CI

# Runs pytest against the backup-service/ Python package using pinned uv.
# Tests cover the pure transforms (filename layout, retention planning, S3 keys)
# and the orchestration (run_once) with all I/O faked — no live Postgres,
# pg_dump, or Spaces required.
# Advisory only in v1 — promote to required check after first clean run.

on:
  pull_request:
    branches: [4.x, 'feature/**']
    paths:
      - 'backup-service/**'
      - '.github/workflows/backup-service-ci.yml'
  push:
    branches: [4.x]
    paths:
      - 'backup-service/**'

permissions:
  contents: read

concurrency:
  group: backup-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.11, uv)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --project backup-service

      - name: Run pytest
        run: uv run --project backup-service pytest backup-service/tests/ -v
