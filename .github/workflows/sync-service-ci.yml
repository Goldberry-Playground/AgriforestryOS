name: Sync service CI

# Runs pytest against the sync-service/ Python package using pinned uv.
# Tests are fully mocked (pytest-httpx) and faked (in-memory Odoo/farmOS);
# no live Odoo or farmOS required.
# Advisory only in v1 — promote to required check after first clean run.

on:
  pull_request:
    branches: [4.x, 'feature/**']
    paths:
      - 'sync-service/**'
      - '.github/workflows/sync-service-ci.yml'
  push:
    branches: [4.x]
    paths:
      - 'sync-service/**'

permissions:
  contents: read

concurrency:
  group: sync-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.11, uv)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --project sync-service

      - name: Run pytest
        run: uv run --project sync-service pytest sync-service/tests/ -v
