#cloud-config
# Bootstraps a fresh Ubuntu droplet into a Docker host that is ready to run the
# AgriforestryOS stack. Idempotent enough for first boot; app deploy itself is
# done by the GitHub Actions workflow (it SSHes in as `deploy`).

package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - ufw

users:
  - name: deploy
    groups: [sudo, docker]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/profile.d/agriforestryos.sh
    content: |
      export AGRIFORESTRYOS_DIR=/opt/agriforestryos

runcmd:
  # Docker Engine + compose plugin (official convenience script).
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - systemctl enable --now docker
  # App directory, owned by the deploy user.
  - mkdir -p /opt/agriforestryos
  - chown -R deploy:deploy /opt/agriforestryos
  # Clone the repo so the box is deploy-ready (GHA pulls + composes after this).
  - sudo -u deploy git clone --branch ${repo_branch} ${repo_url} /opt/agriforestryos/repo || true
  # Firewall: SSH + HTTP/HTTPS only. DB ports (5432/5433) stay closed to the
  # internet — services reach the DBs over the internal docker network; an
  # operator uses an SSH tunnel for psql/QGIS. This is the secure default.
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

final_message: "AgriforestryOS dev host ready after $UPTIME s — Docker installed, repo cloned to /opt/agriforestryos/repo."
