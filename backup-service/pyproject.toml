[project]
name = "agriforestryos-backup"
version = "0.1.0"
description = "Database backup/restore service: pg_dump → local volume + DigitalOcean Spaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
]

[project.scripts]
agriforestryos-backup = "backup:main"
agriforestryos-restore = "restore:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["backup.py", "restore.py"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
