##
# AgriforestryOS development stack (fork-maintained).
#
# Restored after PR #11 ("strip dead upstream farmOS source") removed it as
# part of the upstream cleanup — but this file is the local dev / live-E2E
# harness, not dead source. The repo is now detached from farmOS/farmOS, so
# it is maintained here directly.
#
# Brings up farmOS (Drupal) + Postgres with the built web tree bind-mounted
# from ./www. Layer the farm_syntropic override on top to develop the module:
#
#   cd docker/
#   docker compose \
#     -f docker-compose.development.yml \
#     -f docker-compose.farm-syntropic.yml \
#     up -d
#   docker compose exec www drush en farm_syntropic -y && docker compose exec www drush cr
#
# farmOS is then reachable at http://localhost — the target for the
# Odoo→farmOS sync service and the export_geojson / e2e_test --live runbook.
##
services:
  db:
    image: postgres:17
    volumes:
      - './db:/var/lib/postgresql/data'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
      POSTGRES_DB: farm

  www:
    depends_on:
      - db
    image: farmos/farmos:4.x-dev
    volumes:
      - './www:/opt/drupal'
    ports:
      - '80:80'
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: client_host=host.docker.internal
      XDEBUG_SESSION: 1
      PHP_IDE_CONFIG: serverName=localhost

  # Enable this service when executing javascript tests.
#  chrome:

      # Tests are failing on later versions of this image.
      # See https://github.com/farmOS/farmOS/issues/514
#      image: selenium/standalone-chrome:4.1.2-20220217
