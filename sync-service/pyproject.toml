[project]
name = "agriforestryos-sync"
version = "0.1.0"
description = "Odoo ↔ farmOS sync service: nursery transfers → tree assets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
agriforestryos-sync = "sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["sync.py", "odoo_client.py", "farmos_writer.py", "mapping.py", "state.py"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2,<9",
    "pytest-httpx>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
