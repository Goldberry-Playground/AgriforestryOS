<style>

<script>
// ---------- vocabularies ----------

const PRACTICES={
 food:{n:'Homestead food forest',strata:['emergent','high','low','shrub','herb','ground','root','fungal'],rowSp:6,inRow:2.5,needs:'Water and daily access',infra:['drip','deerfence','paths'],retail:'Food forest track'},

 silvo:{n:'Silvopasture',strata:['emergent','high','ground'],rowSp:15,inRow:6,needs:'Pasture, stock water, fence lines',infra:['protection','paddock','water'],retail:'Agroforestry, silvopasture'},
 forest:{n:'Forest farming',strata:['low','shrub','herb','ground','root','fungal'],rowSp:8,inRow:2,needs:'Standing canopy, shade-tolerant species only',infra:['trails','logyard'],retail:'Forest farming category'},
 myco:{n:'Mycoforestry',strata:['high','low','fungal'],rowSp:8,inRow:2,needs:'Hardwood canopy, moisture, shade',infra:['logyard','soak','chips'],retail:'Mycoforestry category'},

const MODULES=[
 {k:'lifecycle',n:'System architecture and lifecycle',sec:'Succession and lifecycle plan'},
 {k:'perennial',n:'High-value perennial integration',sec:'Perennial integration with the existing operation'},
 {k:'soil',n:'Soil and carbon',sec:'Soil building and nutrient cycling'},
 {k:'water',n:'Water resilience',sec:'Water: contour rows and drainage'},
 {k:'micro',n:'Microclimate buffering',sec:'Wind and frost protection'},
 {k:'habitat',n:'Habitat and pest structuring',sec:'Habitat and pest structuring'},
 {k:'cert',n:'Certification readiness',sec:'Records for certification'},
 {k:'transition',n:'Monoculture transition',sec:'Transition from the existing orchard or vineyard'},
 {k:'nutrient',n:'Nutrient cycling and closed loop',sec:'Closed-loop inputs from prunings'},
 {k:'climate',n:'Climate adaptation',sec:'Drought, heat and flood resilience'},
 {k:'remediation',n:'Site remediation',sec:'Soil-first staging on marginal ground'},
 {k:'wildlife',n:'Wildlife and deer',sec:'Mast and cover for wildlife'},
];
const STEPS=[['consult','Planting consult (free, 30 min)',0],['strategy','Strategy session, in person (2 h min + travel)',200],['plan','Whole-property plan (from, fixed after visit)',800],['workbook','Implementation workbook (from)',2000],['install','Design and install (bid)',0],['steward','Stewardship year',0]];
// st = stratum, stage = succession stage, role anchor or companion. Tolerances: wet, poor, shade. nfix = nitrogen fixer.
const PLANTS=[
 {id:'chestnut',n:'Chinese chestnut',st:'emergent',stage:'abundance',role:'anchor',z:[4,8],fc:3,wet:false,poor:true,shade:false,min:2,pri:1,wild:3,nfix:false,price:28},
 {id:'persimmon',n:'American persimmon',st:'high',stage:'abundance',role:'anchor',z:[4,9],fc:4,wet:true,poor:true,shade:false,min:1,pri:2,wild:3,nfix:false,price:26},
 {id:'apple',n:'Apple, disease resistant',st:'high',stage:'acc2',role:'anchor',z:[4,8],fc:3,wet:false,poor:false,shade:false,min:2,pri:2,wild:3,nfix:false,price:30},
 {id:'mulberry',n:'Mulberry',st:'high',stage:'acc1',role:'companion',z:[4,8],fc:2,wet:false,poor:true,shade:false,min:1,pri:2,wild:3,nfix:false,price:22},
 {id:'locust',n:'Black locust',st:'high',stage:'acc1',role:'companion',z:[4,8],fc:1,wet:false,poor:true,shade:false,min:1,pri:3,wild:1,nfix:true,price:12},
 {id:'hazel',n:'Hybrid hazelnut',st:'low',stage:'acc2',role:'anchor',z:[4,8],fc:2,wet:false,poor:true,shade:true,min:2,pri:1,wild:2,nfix:false,price:18},
 {id:'pawpaw',n:'Pawpaw',st:'low',stage:'acc2',role:'anchor',z:[5,8],fc:4,wet:true,poor:false,shade:true,min:2,pri:2,wild:1,nfix:false,price:32},
 {id:'chinquapin',n:'Allegheny chinquapin',st:'low',stage:'acc1',role:'anchor',z:[5,9],fc:2,wet:false,poor:true,shade:true,min:2,pri:2,wild:3,nfix:false,price:20},
 {id:'jujube',n:'Jujube',st:'low',stage:'acc1',role:'anchor',z:[6,9],fc:2,wet:false,poor:true,shade:false,min:1,pri:3,wild:1,nfix:false,price:34},
 {id:'serviceberry',n:'Serviceberry',st:'low',stage:'acc1',role:'companion',z:[3,7],fc:2,wet:false,poor:true,shade:true,min:1,pri:3,wild:3,nfix:false,price:20},
 {id:'elderberry',n:'Elderberry',st:'shrub',stage:'placenta',role:'companion',z:[3,8],fc:1,wet:true,poor:false,shade:true,min:2,pri:2,wild:2,nfix:false,price:14},
 {id:'seaberry',n:'Seaberry',st:'shrub',stage:'placenta',role:'companion',z:[3,7],fc:2,wet:false,poor:true,shade:false,min:2,pri:3,wild:1,nfix:true,price:18},
 {id:'fig',n:'Fig, Chicago Hardy',st:'shrub',stage:'acc1',role:'companion',z:[7,10],fc:1,wet:false,poor:false,shade:false,min:1,pri:2,wild:0,nfix:false,price:24},
 {id:'aronia',n:'Aronia',st:'shrub',stage:'acc1',role:'companion',z:[3,8],fc:2,wet:true,poor:true,shade:true,min:1,pri:3,wild:2,nfix:false,price:14},
 {id:'comfrey',n:'Comfrey, Bocking 14',st:'herb',stage:'placenta',role:'companion',z:[3,9],fc:1,wet:true,poor:true,shade:true,min:1,pri:1,wild:0,nfix:false,price:8},
 {id:'clover',n:'White clover, seed',st:'ground',stage:'placenta',role:'companion',z:[3,9],fc:1,wet:false,poor:true,shade:true,min:1,pri:2,wild:2,nfix:true,price:6},
 {id:'sunchoke',n:'Sunchoke',st:'root',stage:'placenta',role:'companion',z:[3,9],fc:1,wet:false,poor:true,shade:false,min:1,pri:3,wild:2,nfix:false,price:9},
 {id:'groundnut',n:'Groundnut, Apios',st:'root',stage:'placenta',role:'companion',z:[4,9],fc:2,wet:true,poor:false,shade:true,min:1,pri:3,wild:1,nfix:true,price:11},
 {id:'winecap',n:'Wine cap spawn',st:'fungal',stage:'placenta',role:'anchor',z:[3,9],fc:1,wet:true,poor:true,shade:true,min:1,pri:1,wild:0,nfix:false,price:24,sub:'wood chips'},
 {id:'shiitake',n:'Shiitake plug spawn',st:'fungal',stage:'acc1',role:'companion',z:[4,8],fc:1,wet:false,poor:true,shade:true,min:1,pri:2,wild:0,nfix:false,price:18,sub:'oak or maple logs from prunings'},
 {id:'oyster',n:'Oyster spawn',st:'fungal',stage:'placenta',role:'companion',z:[3,9],fc:1,wet:true,poor:true,shade:true,min:1,pri:2,wild:0,nfix:false,price:18,sub:'fresh hardwood logs'},
];
const BY=Object.fromEntries(PLANTS.map(p=>[p.id,p]));
const ZIPS=[[70,89,'NJ','7a'],[100,119,'NY','7a'],[120,149,'NY','6a'],[150,196,'PA','6b'],[197,199,'DE','7b'],[206,219,'MD','7a'],[220,246,'VA','7a'],[247,254,'WV','6b'],[255,257,'WV','7a'],[258,259,'WV','6a'],[260,266,'WV','6b'],[267,268,'WV','6a'],[270,289,'NC','7b'],[290,299,'SC','8a'],[300,319,'GA','8a'],[370,385,'TN','7a'],[400,427,'KY','6b'],[430,458,'OH','6b'],[460,479,'IN','6a'],[480,499,'MI','6a'],[600,629,'IL','6a']];
const STATE_NAMES={NJ:'New Jersey',NY:'New York',PA:'Pennsylvania',DE:'Delaware',MD:'Maryland',VA:'Virginia',WV:'West Virginia',NC:'North Carolina',SC:'South Carolina',GA:'Georgia',TN:'Tennessee',KY:'Kentucky',OH:'Ohio',IN:'Indiana',MI:'Michigan',IL:'Illinois'};
function lookupZip(z){if(!/^\d{5}$/.test(z||''))return null;const p=+z.slice(0,3);const r=ZIPS.find(r=>p>=r[0]&&p<=r[1]);return r?{state:r[2],zone:r[3]}:null}

// ---------- state ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
let S=load();
function exampleClient(){
  return {id:'example',name:'Example: Hollow Run',zip:'25301',acres:12,step:'plan',hands:'stake',goals:'Nuts and fruit for the family, shade for the cattle on the back pasture, and stop the creek bank from washing. Low input.',have:'Open pasture, a creek with a bare bank, a half acre of lawn by the house, a woodlot on the north line.',modules:['lifecycle','soil','water'],areas:[
    {id:'a1',name:'Back pasture',practice:'silvo',acres:8,wet:false,poor:true,shade:false,aspect:'S'},
    {id:'a2',name:'Creek edge',practice:'riparian',acres:1,wet:true,poor:false,shade:true,aspect:'E'},
    {id:'a3',name:'By the house',practice:'food',acres:0.5,wet:false,poor:false,shade:false,aspect:'S'}],
    site:{pulled:[],walk:{}},plan:null,stage:'intake',signals:[],bundle:null,archived:false,example:true};
}
function fresh(){return {clients:[exampleClient()],open:'example',view:'pipeline',tab:'intake',area:null,cell:null}}
function load(){try{const r=localStorage.getItem('consult-flow-v1');if(r){const o=JSON.parse(r);if(o&&o.clients)return o}}catch(e){}return fresh()}
function save(){try{localStorage.setItem('consult-flow-v1',JSON.stringify(S))}catch(e){}}
const cur=()=>S.clients.find(c=>c.id===S.open);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

// ---------- engine ----------
function zoneOf(c){const h=lookupZip(c.zip);return h?parseInt(h.zone):6}
function eligible(p,area,zone){
  const pr=PRACTICES[area.practice];if(!pr.strata.includes(p.st))return false;
  if(zone<p.z[0]-1||zone>p.z[1]+1)return false;
  if(area.wet&&!p.wet)return false;if(area.poor&&!p.poor)return false;
  const shade=area.shade||area.practice==='forest'||area.practice==='myco';if(shade&&!p.shade)return false;
  return true;
}

  if(!c.plan)return `<div class="card">No plan yet. <button class="btn primary" type="button" id="draft">Draft plan from goals</button></div>`;
  const area=c.areas.find(a=>a.id===S.area)||c.areas[0];S.area=area.id;const pa=c.plan.areas[area.id];const zone=zoneOf(c),pr=PRACTICES[area.practice],g=geometry(area),picks=rowPicks(area,pa.cells),t=totals(c,c.plan);
  const grid=`<table class="grid"><thead><tr><th style="width:112px">Stratum</th>${STAGES.map(s=>`<th>${s.n}<br><span style="font-weight:400;text-transform:none;letter-spacing:0">${s.y}</span></th>`).join('')}</tr></thead><tbody>${STRATA.map(st=>`<tr><td style="font-size:12px;font-weight:600">${st.n}</td>${STAGES.map(sg=>{const key=st.k+'|'+sg.k;if(!pr.strata.includes(st.k)||!st.stages.includes(sg.k))return '<td class="na"></td>';const id=pa.cells[key];const sel=S.cell===key;return `<td class="${id?'pick':'gap'}${sel?' sel':''}"><button type="button" data-cell="${key}">${id?esc(BY[id].n):'gap'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table>`;
  let why='';if(S.cell&&pa.cells.hasOwnProperty(S.cell)){const [st,sg]=S.cell.split('|');const id=pa.cells[S.cell];const cands=PLANTS.filter(p=>p.st===st&&p.stage===sg&&eligible(p,area,zone)&&p.id!==id).map(p=>({p,s:score(p,c,area,zone).s})).sort((a,b)=>b.s-a.s);
    why=`<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:13px"><strong>${id?'Why '+esc(BY[id].n)+' here':'Why this cell is a gap'}</strong><div class="muted">${id?whyText(BY[id],c,area,zone):'Nothing we carry fits this stratum and stage on this site. A gap is a suggestion to the catalog.'}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${cands.slice(0,4).map(x=>`<button class="btn small" type="button" data-swap="${x.p.id}">${id?'Swap for':'Fill with'} ${esc(x.p.n)} (${x.s})</button>`).join('')}${id?`<button class="btn small quiet" type="button" data-clear="1">Remove</button>`:''}</div></div>`}
  const gen=c.plan.sections.filter(s=>s.status==='generated').length;
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px"><button class="btn" type="button" id="draft">Re-draft from goals</button><span class="muted">Keeps edited sections, refreshes figures.</span><span class="muted" style="margin-left:auto">Area:</span><div class="chips">${c.areas.map(a=>`<button class="chip" type="button" data-area="${a.id}" aria-pressed="${a.id===area.id}">${esc(a.name)} · ${PRACTICES[a.practice].n.split(' ')[0].toLowerCase()}</button>`).join('')}</div></div>
  <div class="cols"><div class="stack">
    <div class="card">${siteMap(c,area.id,true)}<div class="rows" style="margin-top:10px"><div class="r h"><span>Row</span><span>Length</span><span>Spacing</span><span>Stems</span><span>Consortium</span></div>${pa.rows.map(r=>`<div class="r"><span>${r.n} · contour${area.wet?', wet':''}${r.planted?' · planted':''}</span><span class="mono">${r.len} m</span><span class="mono">${pr.inRow} m</span><span class="mono">${picks.filter(p=>p.woody).reduce((s,p)=>s+p.qty,0)}</span><span class="muted">${esc(area.name)} consortium, zone ${zone}</span></div>`).join('')}</div><div class="muted" style="margin-top:8px">${pa.rows.length} rows at ${pr.rowSp} m row spacing from ${area.acres} acres. Planting points: one per woody stem at ${pr.inRow} m. Every row in an area shares its consortium in this prototype.</div></div>
    <div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Plan sections</h2><span class="muted">${gen} generated, ${c.plan.sections.length-gen} edited or approved. Every section needs a named person before the plan can be approved.</span></div>
      <div class="stack" style="margin-top:10px;gap:10px">${c.plan.sections.map(s=>`<div class="sec"><div class="h"><strong>${esc(s.title)}</strong><span class="badge ${s.status==='generated'?'gen':s.status==='edited'?'ed':''}">${s.status}${s.by?' · '+esc(s.by):''}</span><button class="btn small" type="button" data-approve="${s.key}" ${s.status==='approved'?'disabled':''}>Approve</button></div><textarea data-sec="${s.key}" aria-label="${esc(s.title)}">${esc(s.text)}</textarea></div>`).join('')}</div></div>
  </div><div class="stack">
    <div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Consortium, ${esc(area.name)}</h2><span class="muted">${pr.n}</span></div><div class="scroll" style="margin-top:8px">${grid}</div><div class="muted" style="margin-top:6px">Amber cells are gaps the catalog cannot fill on this site. Click a cell for the reasons and the alternatives.${area.practice==='silvo'?' Silvopasture hides the shrub layer until stems are protected.':''}</div>${why}</div>
    <div class="card"><h2>Whole site</h2><div class="kv"><span>Rows</span><span class="v">${t.rows}</span><span>Woody stems, planting points</span><span class="v">${t.stems}</span><span>Nitrogen fixers</span><span class="v">${t.nfixShare}% of stems</span><span>First harvest</span><span class="v">year ${t.first}</span>${STRATA.filter(s=>t.byStratum[s.k]).map(s=>`<span style="color:var(--ink-2)">${s.n}</span><span class="v">${t.byStratum[s.k]}</span>`).join('')}</div>
      <div class="kv" style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><span>Plants and spawn</span><span class="v">${money(t.cost)}</span><span>Infrastructure and labor (placeholder rates)</span><span class="v">${money(infraLines(c,c.plan).reduce((s,l)=>s+l.cost,0))}</span><span>${esc(STEPS.find(s=>s[0]===c.step)[1].split(' (')[0])}</span><span class="v">${money(STEPS.find(s=>s[0]===c.step)[2])}</span><span style="font-weight:600">Quote to Odoo</span><span class="v" style="font-weight:600">${money(t.cost+infraLines(c,c.plan).reduce((s,l)=>s+l.cost,0)+STEPS.find(s=>s[0]===c.step)[2])}</span></div>
      <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Infrastructure lines by area</summary><div class="scroll"><table style="margin-top:6px"><thead><tr><th>Area</th><th>Line</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Cost</th></tr></thead><tbody>${infraLines(c,c.plan).map(l=>`<tr><td>${esc(l.area)}</td><td>${l.n}</td><td class="num">${l.q} ${l.u}</td><td class="num">${money(l.rate)}</td><td class="num">${money(l.cost)}</td></tr>`).join('')}</tbody></table></div></details>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" type="button" id="approveplan" ${gen||c.plan.approved?'disabled':''}>${c.plan.approved?'Plan v'+c.plan.version+' approved':'Approve plan v'+c.plan.version}</button><button class="btn primary" type="button" id="sendquote" ${c.plan.approved&&!c.plan.quoteSent?'':'disabled'}>${c.plan.quoteSent?'Quote and plan PDF sent':'Send quote and plan PDF'}</button></div>
      <div class="muted" style="margin-top:6px">${gen?'Approve is locked until every section is edited or approved.':c.plan.quoteSent?'Deliverable sent: plan PDF and the Odoo quotation. Next: Install.':c.plan.approved?'Sending creates the sale.order with the plan JSON attached.':'Plan can be approved.'}</div></div>
  </div></div>`;
}
function install(c){
  if(!c.plan||!c.plan.quoteSent)return `<div class="card">Install opens once the quote is sent from Design.</div>`;
  const list=[];for(const a of c.areas){const pa=c.plan.areas[a.id];const picks=rowPicks(a,pa.cells);for(const r of pa.rows)list.push({a,r,picks})}
  list.sort((x,y)=>(y.a.wet-x.a.wet)||x.a.name.localeCompare(y.a.name)||x.r.n-y.r.n);
  const done=list.filter(x=>x.r.planted).length;const next=list.find(x=>!x.r.planted);
  return `<div class="cols"><div class="stack">
    <div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Rows in planting order</h2><span class="muted">${done} of ${list.length} planted. Wet rows first.</span></div><div class="prog" style="margin:8px 0"><i style="width:${list.length?100*done/list.length:0}%"></i></div>
      ${list.map(x=>{const on=next&&x.r.id===next.r.id;return `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;${on?'background:var(--green-soft)':''}"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><strong>${esc(x.a.name)} · row ${x.r.n}</strong><span class="muted">${x.r.len} m · ${x.picks.filter(p=>p.woody).reduce((s,p)=>s+p.qty,0)} stems</span><span class="badge ${x.r.planted?'':on?'ed':'ghost'}" style="margin-left:auto">${x.r.planted?'planted':on?'now':'queued'}</span></div>
        ${on?`<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Pick</th><th class="num">Qty</th><th>Lot</th><th>Substitute</th></tr></thead><tbody>${x.picks.map(pk=>`<tr><td>${esc(BY[pk.id].n)}${x.r.subs.find(s=>s.from===pk.id)?` <span class="badge gen">swapped for ${esc(BY[x.r.subs.find(s=>s.from===pk.id).to].n)}</span>`:''}</td><td class="num">${pk.qty} ${pk.unit}</td><td class="mono">${pk.woody?'scan':'bulk'}</td><td>${pk.woody?`<select aria-label="Substitute" data-subrow="${x.r.id}" data-from="${pk.id}" style="font-size:12px;padding:3px 6px"><option value="">none</option>${PLANTS.filter(p=>p.st===BY[pk.id].st&&p.id!==pk.id).map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select>`:''}</td></tr>`).join('')}</tbody></table></div>
        <div class="f2" style="margin-top:8px"><div><label for="act-${x.r.id}">Actual stems planted</label><input id="act-${x.r.id}" type="number" min="0" data-actual="${x.r.id}" value="${x.picks.filter(p=>p.woody).reduce((s,p)=>s+p.qty,0)}"></div><div style="display:flex;align-items:flex-end"><button class="btn primary" type="button" data-plant="${x.r.id}" style="width:100%">Mark row planted</button></div></div>`:x.r.planted?`<div class="muted" style="margin-top:4px">${x.r.actual} stems · ${x.r.subs.length} substitution${x.r.subs.length===1?'':'s'}</div>`:''}</div>`}).join('')}</div>
  </div><div class="stack">
    <div class="card"><h2>What each row writes</h2><div class="muted">Odoo transfer from the nursery to the client's stock location by lot. farmOS trees with the lot, tenure client, linked to the row. The row flips to planted with its declared count. A substitution is a cart signal against the consortium.</div></div>
    <div class="card"><h2>Signals logged</h2>${c.signals.length?`<ul class="muted" style="margin:0;padding-left:18px">${c.signals.slice(-8).reverse().map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'<div class="muted">None yet.</div>'}</div>
    ${done===list.length&&list.length?`<div class="card"><h2>Install complete</h2><div class="muted">As-planted map, lot list and the year-one calendar go out now.</div><button class="btn primary" type="button" data-go="handover" style="margin-top:10px">Go to Handover</button></div>`:''}
  </div></div>`;
}
function handover(c){
  if(!c.plan||!c.plan.quoteSent)return `<div class="card">Handover opens once the install is underway.</div>`;
  const t=totals(c,c.plan);const rows=Object.values(c.plan.areas).flatMap(a=>a.rows);const planted=rows.filter(r=>r.planted).length;const events=rows.length*2+c.areas.length*3+1;const lots=rows.reduce((s,r)=>s+(r.actual||0),0);
  const items=[['PDF','Plan: map, rows, consortia, planting order, bill of materials, implementation plan, financials',`${c.plan.sections.length} sections`],['PDF','Site brief, one page','ready'],['GEO','Plantings as GeoJSON and KML with every farmOS attribute',`${rows.length} rows`],['PTS','Planting points, as planted, for RTK or a handheld',`${t.points} points`],['QGZ','QGIS project with the client layers and the elevation clip','ready'],['ICS','Stewardship calendar: pruning, chop and drop, inoculation, harvest, yearly walk',`${events} events`],['PDF','Pruning guide per consortium',`${c.areas.length}`],['CSV','Lot list: what was planted where',`${lots} stems`]];
  const preview=c.bundle?`<pre>${esc(c.bundle)}</pre>`:'';
  return `<div class="cols"><div class="stack">
    <div class="card"><h2>Export bundle</h2><span class="muted">The only thing the client ever sees. Generated from the records; nothing written by hand.</span>${items.map(i=>`<div class="item"><span class="ic">${i[0]}</span><span>${i[1]}</span><span class="c">${i[2]}</span></div>`).join('')}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" type="button" id="bundle" ${planted<rows.length?'disabled':''}>Build bundle</button><span class="muted" style="align-self:center">${planted<rows.length?`${rows.length-planted} row${rows.length-planted===1?'':'s'} still to plant.`:c.bundle?'Built and written to Spaces under the opportunity.':'Writes to Spaces, then send to the client with the 30-minute walkthrough.'}</span></div>${preview}</div>
  </div><div class="stack">
    <div class="card"><h2>Archive</h2><div class="muted">Client records are plans, not our inventory. Archive, never delete. Skipped while a stewardship tier is active.</div><div style="margin-top:8px;font-size:14px;display:flex;flex-direction:column;gap:4px"><span>Stock location: transfer out to the client, then archive (lots stay on the moves)</span><span>farmOS property, ${c.areas.length} areas, ${rows.length} rows, ${lots} trees: archive (off the active maps and counts; logs kept)</span><span>PostGIS mirror prunes on its next pass</span><span>Trials this client is in keep their groups queryable</span><span>Odoo opportunity to Won, stage Archived</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" type="button" id="archive" ${c.bundle&&!c.archived?'':'disabled'}>${c.archived?'Archived':'Archive client'}</button><button class="btn" type="button" id="steward" ${c.archived||c.step==='steward'?'disabled':''}>${c.step==='steward'?'On stewardship':'Stewardship year instead'}</button></div></div>
    <div class="card"><h2>Stewardship</h2><div class="muted">Keeps the client active. Visits land on the calendar, logs feed the species facts and the trials, and the bundle is rebuilt each year.</div></div>
  </div></div>`;
}
function bundleText(c){const t=totals(c,c.plan);const hit=lookupZip(c.zip);return `${c.name}\nPlan v${c.plan.version} · ZIP ${c.zip} · zone ${hit?hit.zone:zoneOf(c)} · ${c.acres} acres\n\n`+c.areas.map(a=>{const pa=c.plan.areas[a.id];return `${a.name} · ${PRACTICES[a.practice].n} · ${pa.rows.length} rows\n  `+rowPicks(a,pa.cells).map(pk=>`${BY[pk.id].n} ×${pk.qty*pa.rows.length}`).join(', ')}).join('\n')+`\n\n${t.points} planting points · first harvest year ${t.first} · ${t.nfixShare}% nitrogen fixers\n\nSections: `+c.plan.sections.map(s=>s.title).join('; ')+`\n\nFiles: plan.pdf, site-brief.pdf, plantings.geojson, plantings.kml, points.gpx, client.qgz, calendar.ics, pruning-guides.pdf, lots.csv`}

// ---------- events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const c=cur();
  if(b.dataset.view){S.view=b.dataset.view;if(S.view==='client'&&!c)S.view='pipeline';render();return}
  if(b.dataset.open){S.open=b.dataset.open;S.view='client';const st=stageOf(cur());S.tab={intake:'intake',site:'site',design:'design',quote:'design',install:'install',handover:'handover',stewardship:'handover',archived:'handover'}[st];S.area=null;S.cell=null;render();return}
  if(b.id==='newclient'){const id=uid();S.clients.push({id,name:'New client',zip:'',acres:1,step:'strategy',hands:'stake',goals:'',have:'',modules:['lifecycle'],areas:[{id:uid(),name:'Area 1',practice:'food',acres:1,wet:false,poor:false,shade:false,aspect:'S'}],site:{pulled:[],walk:{}},plan:null,stage:'intake',signals:[],bundle:null,archived:false});S.open=id;S.view='client';S.tab='intake';render();return}
  if(b.id==='reset'){S=fresh();render();toast('Prototype reset');return}
  if(b.id==='copysession'){const txt=sessionText();const ta=$('#sessiontext');ta.value=txt;ta.hidden=false;
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Copied. Paste it into the feedback form.'),()=>{ta.focus();ta.select()});else{ta.focus();ta.select()}
    return}
  if(!c)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;S.cell=null;render();return}
  if(b.dataset.go){S.tab=b.dataset.go;render();return}
  if(b.id==='addarea'){c.areas.push({id:uid(),name:'Area '+(c.areas.length+1),practice:'food',acres:1,wet:false,poor:false,shade:false,aspect:'S'});render();return}
  if(b.dataset.del){c.areas=c.areas.filter(a=>a.id!==b.dataset.del);if(c.plan)delete c.plan.areas[b.dataset.del];render();return}
  if(b.dataset.t){const a=c.areas.find(a=>a.id===b.dataset.a);a[b.dataset.t]=!a[b.dataset.t];render();return}
  if(b.dataset.mod){const i=c.modules.indexOf(b.dataset.mod);i>=0?c.modules.splice(i,1):c.modules.push(b.dataset.mod);render();return}
  if(b.dataset.pull){const i=c.site.pulled.indexOf(b.dataset.pull);if(i<0)c.site.pulled.push(b.dataset.pull);render();return}
  if(b.id==='draft'){c.plan=draftPlan(c);S.tab='design';S.cell=null;render();toast('Plan v'+c.plan.version+' drafted from goals');return}
  if(b.dataset.area){S.area=b.dataset.area;S.cell=null;render();return}
  if(b.dataset.cell){S.cell=S.cell===b.dataset.cell?null:b.dataset.cell;render();return}
  if(b.dataset.swap&&S.cell){const pa=c.plan.areas[S.area];const old=pa.cells[S.cell];pa.cells[S.cell]=b.dataset.swap;c.signals.push(`Design: ${old?BY[old].n+' swapped for ':'gap filled with '}${BY[b.dataset.swap].n} in ${c.areas.find(a=>a.id===S.area).name}`);refreshFigures(c);render();return}
  if(b.dataset.clear&&S.cell){const pa=c.plan.areas[S.area];c.signals.push(`Design: ${BY[pa.cells[S.cell]].n} removed in ${c.areas.find(a=>a.id===S.area).name}`);pa.cells[S.cell]=null;refreshFigures(c);render();return}
  if(b.dataset.approve){const s=c.plan.sections.find(s=>s.key===b.dataset.approve);s.status='approved';s.by='Josh';render();return}
  if(b.id==='approveplan'){c.plan.approved=true;render();toast('Plan v'+c.plan.version+' approved');return}
  if(b.id==='sendquote'){c.plan.quoteSent=true;S.tab='install';render();toast('Quote and plan PDF sent; sale.order created');return}
  if(b.dataset.plant){const r=Object.values(c.plan.areas).flatMap(a=>a.rows).find(r=>r.id===b.dataset.plant);const inp=document.querySelector(`[data-actual="${r.id}"]`);r.planted=true;r.actual=inp?+inp.value||0:0;render();toast('Row planted: transfer and farmOS trees written');return}
  if(b.id==='bundle'){c.bundle=bundleText(c);render();toast('Bundle built and written to Spaces');return}
  if(b.id==='archive'){c.archived=true;render();toast('Client archived; history kept');return}
  if(b.id==='steward'){c.step='steward';render();return}
});
function sessionText(){const who=($('#whoname').value||'anonymous').trim();const out=[`Grove Consult session · ${who} · ${new Date().toISOString().slice(0,16).replace('T',' ')}`];
  for(const c of S.clients){if(c.example&&!c.plan)continue;out.push(`Client ${c.name} · ZIP ${c.zip} zone ${zoneOf(c)} · ${c.acres} ac · stage ${STAGE_N[stageOf(c)]} · step ${c.step} · modules ${c.modules.join(', ')||'none'}`);
    for(const a of c.areas)out.push(`  Area ${a.name}: ${PRACTICES[a.practice].n}, ${a.acres} ac, ${[a.wet?'wet':'',a.poor?'poor':'',a.shade?'shade':''].filter(Boolean).join(' ')||'open'}, ${a.aspect}`+(c.plan&&c.plan.areas[a.id]?` -> ${c.plan.areas[a.id].rows.length} rows: `+rowPicks(a,c.plan.areas[a.id].cells).map(p=>`${BY[p.id].n} x${p.qty}`).join(', '):''));
    if(c.plan)out.push(`  Sections: ${c.plan.sections.map(s=>`${s.title} [${s.status}]`).join('; ')}`);
    if(c.signals.length)out.push('  Signals: '+c.signals.join(' | '))}
  return out.join('\n')}
function refreshFigures(c){const keep=c.plan.sections;const fresh=buildSections(c,c.plan);c.plan.sections=fresh.map(s=>{const o=keep.find(k=>k.key===s.key);return o&&o.status!=='generated'?o:s})}
document.addEventListener('input',e=>{const t=e.target,c=cur();if(!c)return;
  if(t.dataset.f){let v=t.value;if(t.dataset.f==='zip')v=v.replace(/\D/g,'').slice(0,5);if(t.dataset.f==='acres')v=+v||0;c[t.dataset.f]=v;if(t.dataset.f==='zip'||t.dataset.f==='name'){save();renderNav();const n=t.nextElementSibling;if(n&&t.dataset.f==='zip'){const h=lookupZip(v);n.textContent=h?`Zone ${h.zone}, ${STATE_NAMES[h.state]}`:'Unknown ZIP, zone 6 assumed'}}else save();return}
  if(t.dataset.a&&t.dataset.k){const a=c.areas.find(a=>a.id===t.dataset.a);a[t.dataset.k]=t.dataset.k==='acres'?(+t.value||0.1):t.value;save();if(t.tagName==='SELECT')render();return}
  if(t.dataset.sec){const s=c.plan.sections.find(s=>s.key===t.dataset.sec);s.text=t.value;if(s.status==='generated'){s.status='edited';s.by='Josh';const badge=t.parentElement.querySelector('.badge');if(badge){badge.className='badge ed';badge.textContent='edited · Josh'}}save();return}
  if(t.dataset.walk){c.site.walk[t.dataset.walk]=t.checked;save();return}
});
document.addEventListener('change',e=>{const t=e.target,c=cur();if(!c)return;
  if(t.dataset.subrow){const r=Object.values(c.plan.areas).flatMap(a=>a.rows).find(r=>r.id===t.dataset.subrow);r.subs=r.subs.filter(s=>s.from!==t.dataset.from);if(t.value){r.subs.push({from:t.dataset.from,to:t.value});c.signals.push(`Install: ${BY[t.dataset.from].n} substituted with ${BY[t.value].n} on row ${r.n}`)}render();return}
  if(t.dataset.f==='step'||t.dataset.f==='hands'){c[t.dataset.f]=t.value;render();return}
});
render();
</script>
</body></html>
